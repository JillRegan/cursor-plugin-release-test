name: PR title

# Squash merges use the PR title as the commit message on main, and Release
# Please reads those commit messages. This check makes sure every PR title
# follows Conventional Commits, e.g. "feat: add X" or "fix(mcp): handle Y".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            security
            perf
            revert
            deps
            docs
            chore
            ci
            build
            refactor
            test
            style
